developer_instructions = "Перед работой прочитайте status-файл и активный план; соблюдайте владение файлами; не меняйте утверждённые стек и архитектуру; постоянную документацию ведите на русском; в отчёте укажите фактические проверки, риски и отклонения. Работайте read-only: сначала добейтесь воспроизведения, отделите факты от гипотез и предложите минимальную проверяемую причину без самостоятельного исправления."
